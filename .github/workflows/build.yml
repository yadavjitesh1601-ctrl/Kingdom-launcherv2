name: Build Sovereign OS Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Zip
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted
          PROJECT_ROOT=$(find extracted -name "build.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_ROOT" ]; then
            cp -rn "$PROJECT_ROOT"/* . || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK with Forced Google Repos
        run: |
          # Force Gradle to look in Google's servers for the Android plugins
          cat << 'EOF' > init.gradle
          settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      google()
                      mavenCentral()
                      gradlePluginPortal()
                  }
              }
              settings.dependencyResolutionManagement {
                  repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
                  repositories {
                      google()
                      mavenCentral()
                  }
              }
          }
          EOF
          
          if [ ! -f "./gradlew" ]; then
            gradle wrapper || true
          fi
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --init-script init.gradle --no-daemon --stacktrace || gradle assembleDebug --init-script init.gradle

      - name: Upload Sovereign OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignOS-Debug-APK
          path: "**/outputs/apk/debug/*.apk"
