name: Build Sovereign OS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Official Gradle setup: caches dependencies & automatically installs Gradle if wrapper is missing
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Uses the pre-installed Android SDK on GitHub Runner and accepts licenses
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission & Build APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Sovereign OS APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SovereignOS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
