name: Build Sovereign OS Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK from Zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Automatically unpacks zip if uploaded as a zip
      - name: Auto-Unzip Project Files
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found zip file in repository! Unzipping..."
            unzip -o *.zip
          fi

      - name: Build Debug APK
        run: |
          # Locate where settings.gradle.kts lives after unzipping
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            echo "Entering project directory: $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi

          # Enable AndroidX and Jetifier in gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Sovereign OS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SovereignOS-Debug-APK
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 14
