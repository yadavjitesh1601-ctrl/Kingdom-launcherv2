name: Build APK from Zip
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o *.zip -d project
          cp -r project/*/* . || cp -r project/* . || true

      - name: Patch Compose Plugin Error
        run: |
          # Remove broken alias reference across all build.gradle.kts and build.gradle files
          find . -name "build.gradle.kts" -o -name "build.gradle" | while read -r f; do
            sed -i '/alias(libs\.plugins\.kotlin\.compose)/d' "$f"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kingdom-launcher-apk
          path: "**/outputs/apk/debug/*.apk"
